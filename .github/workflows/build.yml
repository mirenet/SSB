name: Build SSB Factory App APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Izvuci kod
        uses: actions/checkout@v4

      - name: Postavi Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Proveri i pripremi Gradle wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Gradlew ne postoji, generisem Gradle 8.2..."
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Pokreni Gradle Build (Debug APK)
        run: ./gradlew assembleDebug

      - name: Sačuvaj APK kao Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssb-factory-apk
          path: app/build/outputs/apk/debug/app-debug.apk
