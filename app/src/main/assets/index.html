<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build App</title>
    <style>
        html {
            color-scheme: dark;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #070707;
            color: #DADADA;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px 16px;
            height: 100dvh;
            box-sizing: border-box;
            overflow: hidden;
        }

        button, input, textarea {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus, button:active, input:focus, textarea:focus {
            outline: none;
        }

        .container {
            max-width: 600px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .title {
            font-size: 20px;
            font-weight: 500;
            color: #CBD868;
            margin-left: 2px;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .apk-import-btn {
            background: #141814;
            border: none;
            color: #68D87C;
            cursor: pointer;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            box-shadow: 0 0 0 0.6px #3f6b47;
        }

        .apk-import-btn:hover {
            background: #1c241d;
            color: #8ef09f;
        }

        .apk-import-btn:active {
            transform: scale(0.94);
        }

        .apk-import-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .settings-icon-btn {
            background: #1a1a1a;
            border: none;
            color: #CBD868;
            cursor: pointer;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            box-shadow: 0 0 0 0.6px #555555;
        }

        .settings-icon-btn:hover {
            background: #2a2a2a;
        }

        .settings-icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .code-icon-btn {
            background: transparent;
            border: none;
            color: #618A51;
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
            border-radius: 8px;
        }

        .code-icon-btn:hover {
            color: #85B570;
            background: rgba(97, 138, 81, 0.25);
        }

        .code-icon-btn:active {
            transform: scale(0.93);
        }

        .code-icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .field-group {
            flex-shrink: 0;
        }

        .label {
            font-size: 13px;
            color: #9E9DA4;
            margin-left: 2px;
            margin-bottom: 5px;
            display: block;
        }

        .input-field {
            width: 100%;
            height: 46px;
            background-color: #121212;
            border: none;
            border-radius: 8px;
            color: #DADADA;
            font-size: 14px;
            padding: 0 14px;
            box-sizing: border-box;
            box-shadow: 0 0 0 0.6px #555555;
        }

        .input-field:focus {
            box-shadow: 0 0 0 1px #727175;
        }

        .input-field::placeholder {
            color: #555555;
        }

        .icon-preview-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            background: #1a1a1a;
            border: none;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            padding: 0;
            color: #8B8B8B;
            box-shadow: 0 0 0 0.6px #555555;
        }

        .icon-preview-btn:hover {
            background: #2a2a2a;
            color: #CBD868;
        }

        .icon-preview-btn svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-preview-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .btn {
            flex: 1;
            height: 44px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
        }

        .btn-create {
            background-color: #CBD868;
            color: #000000 !important;
            box-shadow: 0 0 0 0.6px #CBD868;
        }

        .btn-create:hover {
            filter: brightness(1.15);
        }

        .btn-cancel {
            background-color: #DA2F31;
            color: #FFFFFF !important;
            box-shadow: 0 0 0 0.6px #555555;
        }

        .btn-cancel:hover {
            filter: brightness(1.15);
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            margin-left: 2px;
            margin-right: 2px;
            flex-shrink: 0;
        }

        .status {
            font-size: 14px;
            font-weight: bold;
            color: #D94242;
        }

        .spinner {
            width: 15px;
            height: 15px;
            border: 2px solid #333;
            border-top: 2px solid #CBD868;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .build-settings-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 38px;
            background-color: #121212;
            border-radius: 10px;
            padding: 12px;
            width: 164px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.88), 0 0 0 0.6px #738678;
            z-index: 100;
            box-sizing: border-box;
        }

        .divider {
            width: 100%;
            height: 1px;
            background-color: #1A1A1A;
            flex-shrink: 0;
        }

        .logs-section {
            flex: 1;
            min-height: 75px;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #CBD868;
            margin-left: 4px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .logs-box {
            flex: 1;
            min-height: 0;
            font-family: monospace;
            font-size: 12px;
            color: #7F9BAA;
            background-color: #111;
            padding: 10px 12px;
            border-radius: 8px;
            line-height: 1.45;
            overflow-y: auto;
            box-sizing: border-box;
            width: 100%;
            box-shadow: 0 0 0 0.6px #555555;
        }

        .logs-box:hover {
            box-shadow: 0 0 0 1px #727175;
        }

        .btn-install {
            width: 100%;
            height: 44px;
            background-color: #1a1a1a;
            color: #777777;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: not-allowed;
            box-shadow: 0 0 0 0.6px #555555;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .btn-install.active {
            background-color: #1a1a1a;
            color: #7F9BAA !important;
            cursor: pointer;
            box-shadow: 0 0 0 0.8px #7F9BAA;
        }

        .btn-install.active:hover {
            background-color: #252525;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
            z-index: 200;
        }

        .modal-content {
            background-color: #121212;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 16px;
            box-sizing: border-box;
            box-shadow: 0 0 0 0.6px #555555;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #CBD868;
            font-weight: bold;
            font-size: 15px;
        }

        .close-modal {
            background: none;
            border: none;
            color: #9E9DA4;
            font-size: 20px;
            cursor: pointer;
        }

        .config-textarea {
            width: 100%;
            height: 220px;
            background-color: #070707;
            border: none;
            border-radius: 8px;
            color: #CBD868;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 12px;
            box-shadow: 0 0 0 0.6px #555555;
        }

        .save-config-btn {
            width: 100%;
            height: 38px;
            background-color: #CBD868;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 0 0.6px #CBD868;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title">Build App</div>
            <div class="action-buttons">
                <button type="button" class="apk-import-btn" id="importApkBtn" onclick="document.getElementById('apkFileInput').click()" title="Import APK">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
                        <path d="M9 13h6M12 10v6"/>
                    </svg>
                </button>
                <input type="file" id="apkFileInput" accept=".apk,application/vnd.android.package-archive" style="display: none;" onchange="selectCustomApk(event)">

                <button type="button" class="settings-icon-btn" id="openConfigModal" title="App Config">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06-.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l-.06-.06a2 2 0 0 1 2.83 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="field-group">
            <label class="label">Enter Name</label>
            <input type="text" id="appName" class="input-field" value="Google App">
        </div>

        <div class="field-group">
            <label class="label">Package</label>
            <input type="text" id="appPackage" class="input-field" value="com.google.app" maxlength="14" oninput="enforcePackageLimit(this)">
        </div>

        <div class="field-group">
            <label class="label">Url Address</label>
            <div style="position: relative;">
                <input type="text" id="appUrl" class="input-field" value="https://www.google.com" style="padding-right: 46px;">
                <button type="button" class="icon-preview-btn" id="iconInputBtn" onclick="document.getElementById('iconFileInput').click()" title="Select app icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </button>
            </div>
            <input type="file" id="iconFileInput" accept="image/*" style="display: none;" onchange="previewIcon(event)">
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-create" id="btnCreate" onclick="startBuild()">Create</button>
            <button type="button" class="btn btn-cancel" id="btnCancel" onclick="resetBuild()">Cancel</button>
        </div>

        <div class="status-container">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="status" id="statusText">Status: OFF</div>
                <div class="spinner" id="spinner"></div>
            </div>

            <button type="button" class="code-icon-btn" id="openBuildSettings" title="Manifest SDK min/max" onclick="toggleBuildSettings(event)">
                <svg viewBox="0 0 24 24">
                    <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/>
                    <path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>
                </svg>
            </button>

            <div class="build-settings-dropdown" id="buildSettingsDropdown">
                <input type="text" id="sdkMin" class="input-field" placeholder="SDK min (manifest)" style="height: 40px; font-size: 12px; padding: 0 10px; margin-bottom: 12px;" oninput="autoSaveSettings()">
                <input type="text" id="sdkMax" class="input-field" placeholder="SDK max (manifest)" style="height: 40px; font-size: 12px; padding: 0 10px; margin-bottom: 0;" oninput="autoSaveSettings()">
            </div>
        </div>

        <div class="divider"></div>

        <div class="logs-section">
            <div class="section-title">Build Logs:</div>
            <div class="logs-box" id="logsBox">Local APK builder ready..<br>Use skeleton from assets or import an APK top right..<br>Click "Create" to modify and sign..</div>
        </div>

        <button type="button" class="btn-install" id="installBtn" disabled onclick="installApp()">Install APK</button>
    </div>

    <div class="modal" id="configModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Config..</span>
                <button type="button" class="close-modal" id="closeModal">&times;</button>
            </div>
            <textarea class="config-textarea" id="configContent">const config = {
external: [],
startURL: "",
broAgent: "",
portrait: true,
screenOn: false,
allowZoom: false,
forceDark: false,
refreshOn: false,
scrollBar: true,
mobilView: true,
background: false
};</textarea>
            <button type="button" class="save-config-btn" id="saveConfig">Save Config</button>
        </div>
    </div>

    <script>
        let selectedApkName = "assets/skeleton.apk";
        let importedApkBase64 = "";
        let selectedIconBase64 = "";

        window.addEventListener('DOMContentLoaded', () => {
            const pkgInput = document.getElementById('appPackage');
            const lockedMax = parseInt(pkgInput.getAttribute('maxlength') || String(pkgInput.value.length), 10);
            pkgInput.dataset.maxLen = String(lockedMax);
            if (pkgInput.value.length > lockedMax) {
                pkgInput.value = pkgInput.value.slice(0, lockedMax);
            }

            const savedConfig = localStorage.getItem('appConfigText');
            if (savedConfig) {
                document.getElementById('configContent').value = savedConfig;
            }
            if (localStorage.getItem('sdkMin')) {
                document.getElementById('sdkMin').value = localStorage.getItem('sdkMin');
            }
            if (localStorage.getItem('sdkMax')) {
                document.getElementById('sdkMax').value = localStorage.getItem('sdkMax');
            }
        });

        function enforcePackageLimit(inputEl) {
            const maxLen = parseInt(inputEl.dataset.maxLen || inputEl.getAttribute('maxlength') || '14', 10);
            if (inputEl.value.length > maxLen) {
                inputEl.value = inputEl.value.slice(0, maxLen);
            }
        }

        function autoSaveSettings() {
            const min = document.getElementById('sdkMin').value.trim();
            const max = document.getElementById('sdkMax').value.trim();
            if (min !== '') localStorage.setItem('sdkMin', min); else localStorage.removeItem('sdkMin');
            if (max !== '') localStorage.setItem('sdkMax', max); else localStorage.removeItem('sdkMax');
        }

        const modal = document.getElementById('configModal');
        document.getElementById('openConfigModal').onclick = () => modal.style.display = 'flex';
        document.getElementById('closeModal').onclick = () => modal.style.display = 'none';
        document.getElementById('saveConfig').onclick = () => {
            localStorage.setItem('appConfigText', document.getElementById('configContent').value);
            modal.style.display = 'none';
        };

        function toggleBuildSettings(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('buildSettingsDropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        window.onclick = function(event) {
            const dropdown = document.getElementById('buildSettingsDropdown');
            const btn = document.getElementById('openBuildSettings');
            if (dropdown && btn && !dropdown.contains(event.target) && event.target !== btn && !btn.contains(event.target)) {
                dropdown.style.display = 'none';
            }
        };

        function selectCustomApk(event) {
            const file = event.target.files[0];
            if (file) {
                selectedApkName = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const result = e.target.result || "";
                    importedApkBase64 = result.includes(",") ? result.split(",")[1] : result;
                    appendLog(`[INFO] Imported APK: ${file.name}`);
                };
                reader.readAsDataURL(file);
            }
        }

        function previewIcon(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedIconBase64 = e.target.result || "";
                    const btn = document.getElementById('iconInputBtn');
                    btn.innerHTML = `<img src="${selectedIconBase64}" alt="Icon">`;
                    btn.style.boxShadow = "0 0 0 0.6px #CBD868";
                };
                reader.readAsDataURL(file);
            }
        }

        function appendLog(msg) {
            const logsBox = document.getElementById('logsBox');
            logsBox.innerHTML += `<br>${msg}`;
            logsBox.scrollTop = logsBox.scrollHeight;
        }

        function setAppReadyForInstall() {
            const statusText = document.getElementById('statusText');
            const spinner = document.getElementById('spinner');
            const installBtn = document.getElementById('installBtn');

            statusText.textContent = "Status: SUCCESS";
            statusText.style.color = "#68D87C";
            spinner.style.display = "none";
            installBtn.classList.add('active');
            installBtn.disabled = false;
        }

        function setBuildError(msg) {
            const statusText = document.getElementById('statusText');
            const spinner = document.getElementById('spinner');
            appendLog(`[ERROR] ${msg}`);
            statusText.textContent = "Status: ERROR";
            statusText.style.color = "#D94242";
            spinner.style.display = "none";
        }

        function startBuild() {
            const statusText = document.getElementById('statusText');
            const spinner = document.getElementById('spinner');
            const logsBox = document.getElementById('logsBox');
            const installBtn = document.getElementById('installBtn');

            const appName = document.getElementById('appName').value.trim();
            const pkgEl = document.getElementById('appPackage');
            enforcePackageLimit(pkgEl);
            const appPackage = pkgEl.value.trim();
            const appUrl = document.getElementById('appUrl').value.trim();
            const configContent = document.getElementById('configContent').value;
            const sdkMin = document.getElementById('sdkMin').value.trim();
            const sdkMax = document.getElementById('sdkMax').value.trim();

            installBtn.classList.remove('active');
            installBtn.disabled = true;

            statusText.textContent = "Status: Working...";
            statusText.style.color = "#D94242";
            spinner.style.display = "block";
            logsBox.innerHTML = `[INFO] Package source: ${selectedApkName} (min:${sdkMin || "manifest"}, max:${sdkMax || "manifest"})`;

            if (window.AndroidBridge && typeof window.AndroidBridge.startCreatingApp === "function") {
                window.AndroidBridge.startCreatingApp(
                    appName,
                    appPackage,
                    selectedIconBase64,
                    appUrl,
                    configContent,
                    sdkMin,
                    sdkMax,
                    importedApkBase64
                );
                return;
            }

            setTimeout(() => appendLog("[INFO] Extracting APK archive to working directory.."), 350);
            setTimeout(() => appendLog("[INFO] Scaling and replacing icons in res/.."), 750);
            setTimeout(() => appendLog("[INFO] Updating startURL and appConfig values in assets/.."), 1150);
            setTimeout(() => appendLog("[INFO] Updating app name, package name, and SDK values.."), 1550);
            setTimeout(() => appendLog("[INFO] Repacking and aligning entries inside APK.."), 2000);
            setTimeout(() => appendLog("[SIGN] Signing output APK (debug key).."), 2450);
            setTimeout(() => {
                appendLog("[SUCCESS] APK ready for installation!");
                setAppReadyForInstall();
            }, 2900);
        }

        function resetBuild() {
            const statusText = document.getElementById('statusText');
            const spinner = document.getElementById('spinner');
            const logsBox = document.getElementById('logsBox');
            const installBtn = document.getElementById('installBtn');

            selectedApkName = "assets/skeleton.apk";
            importedApkBase64 = "";
            document.getElementById('apkFileInput').value = "";

            statusText.textContent = "Status: OFF";
            statusText.style.color = "#D94242";
            spinner.style.display = "none";
            logsBox.innerHTML = "Local APK builder ready..<br>Use skeleton from assets or import an APK top right..<br>Click \"Create\" to modify and sign..";

            installBtn.classList.remove('active');
            installBtn.disabled = true;
        }

        function installApp() {
            if (window.AndroidBridge && typeof window.AndroidBridge.installApp === "function") {
                window.AndroidBridge.installApp();
            } else {
                alert("Connect AndroidBridge.installApp() to start installation.");
            }
        }
    </script>
</body>
</html>
